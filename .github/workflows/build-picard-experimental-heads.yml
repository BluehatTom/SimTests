name: Build Picard experimental mouthpieces
on:
  push:
    paths:
      - 'Picard-Flute-v3/CAD/build_alt_heads_compact.py'
      - '.github/workflows/build-picard-experimental-heads.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-stls:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD and mesh QA packages
        run: python -m pip install 'cadquery>=2.4,<3' 'trimesh>=4,<5'
      - name: Generate and verify nine replacement heads
        run: python Picard-Flute-v3/CAD/build_alt_heads_compact.py
      - name: Commit individual STLs to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Picard-Flute-v3/Experimental_Mouthpieces/*.stl Picard-Flute-v3/QA/alternative_heads.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build nine experimental Picard flute mouthpieces'
            git push
          fi
      - name: Offer single ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picard-Flute-v3-Experimental-Mouthpieces
          path: |
            Picard-Flute-v3/Experimental_Mouthpieces/*.stl
            Picard-Flute-v3/Experimental_Mouthpieces/README.md
            Picard-Flute-v3/Experimental_Mouthpieces/Test_Scorecard.csv
