name: Build circular Picard flute mouthpieces
on:
  push:
    paths:
      - 'Picard-Flute-v3/Radial_Labium_Harmonics/CAD/**'
      - '.github/workflows/build-picard-ring-labia.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD and mesh QA
        run: python -m pip install 'cadquery>=2.4,<3' 'trimesh>=4,<5'
      - name: Generate and verify radial-labium heads
        run: python Picard-Flute-v3/Radial_Labium_Harmonics/CAD/build_radial_labia.py
      - name: Commit real binary STL files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Picard-Flute-v3/Radial_Labium_Harmonics/STL/*.stl Picard-Flute-v3/Radial_Labium_Harmonics/QA/mesh_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build five Picard circular harmonics mouthpiece STLs'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Upload ready-to-print ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Picard-v3-Radial-Multi-Labium-5-STLs
          path: |
            Picard-Flute-v3/Radial_Labium_Harmonics/STL/*.stl
            Picard-Flute-v3/Radial_Labium_Harmonics/README.md
            Picard-Flute-v3/Radial_Labium_Harmonics/QA/mesh_validation.json
