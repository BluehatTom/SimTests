name: Build Picard flute expanded-range bodies
on:
  push:
    paths:
      - 'Picard-Flute-v3/CAD/build_range_expansion.py'
      - '.github/workflows/build-picard-range.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-stls:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD and STL checker
        run: python -m pip install 'cadquery>=2.4,<3' 'trimesh>=4,<5'
      - name: Generate six new printable parts and validate geometry
        run: python Picard-Flute-v3/CAD/build_range_expansion.py
      - name: Commit individual STL files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Picard-Flute-v3/Range_Expansion_STLs/*.stl Picard-Flute-v3/Range_Expansion_Docs/mesh_qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build Picard flute expanded-range printable STL files'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Upload printable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picard-Flute-v3-More-Notes-6-STLs
          path: |
            Picard-Flute-v3/Range_Expansion_STLs/*.stl
            Picard-Flute-v3/Range_Expansion_README.md
